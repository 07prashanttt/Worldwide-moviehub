<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHUB - Built by Prashant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Poppins', sans-serif; min-height: 100vh; }
    
    header {
      background: #111827;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3b82f6;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 10px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 20px; font-weight: 700; color: #3b82f6; text-decoration: none; }
    .logo span { color: #e11d48; }

    .built-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
      text-transform: uppercase;
    }

    .search-box { display: flex; gap: 6px; flex-grow: 1; max-width: 320px; }
    .search-box input {
      background: #1f2937; border: 1px solid #374151; padding: 8px 12px;
      border-radius: 6px; color: #fff; font-size: 13px; width: 100%; outline: none;
    }
    .search-box button {
      background: #2563eb; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }

    .container { max-width: 1200px; margin: 15px auto; padding: 0 12px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .section-title { font-size: 16px; border-left: 4px solid #2563eb; padding-left: 10px; font-weight: 600; }
    .movie-count { font-size: 12px; color: #9ca3af; }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media(min-width: 480px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(min-width: 768px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
    @media(min-width: 1024px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }

    .movie-card {
      background: #111827; border-radius: 8px; overflow: hidden;
      border: 1px solid #1f2937; cursor: pointer; transition: transform 0.2s;
      display: flex; flex-direction: column;
    }
    .movie-card:hover { transform: translateY(-4px); }

    .poster-wrapper { position: relative; width: 100%; padding-top: 145%; background: #1f2937; }
    .poster-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    .rating-badge {
      position: absolute; top: 6px; left: 6px;
      background: rgba(225, 29, 72, 0.9); color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }

    .movie-info { padding: 8px 10px; flex-grow: 1; }
    .movie-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; color: #f3f4f6; }

    .load-more-btn {
      display: block; width: 220px; margin: 25px auto; padding: 12px;
      background: #2563eb; color: #fff; border: none; border-radius: 20px;
      font-weight: 600; cursor: pointer; text-align: center; font-size: 14px;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; padding: 12px;
    }
    .modal-content {
      background: #111827; border-radius: 10px; max-width: 800px; width: 100%;
      max-height: 90vh; overflow-y: auto; border: 1px solid #374151; position: relative;
    }
    .close-btn {
      position: absolute; top: 8px; right: 12px; font-size: 24px; color: #fff;
      cursor: pointer; z-index: 20; background: rgba(0,0,0,0.5); width: 32px; height: 32px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .modal-body { padding: 15px; }
    .download-section { margin-top: 15px; background: #1f2937; padding: 12px; border-radius: 8px; }
    .download-section h4 { color: #10b981; font-size: 14px; margin-bottom: 10px; }
    .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media(min-width: 550px) { .dl-grid { grid-template-columns: repeat(3, 1fr); } }
    
    .dl-btn {
      background: #2563eb; color: #fff; text-decoration: none; padding: 8px 10px;
      border-radius: 6px; font-size: 11px; font-weight: 600; text-align: center; display: block;
    }
    .dl-btn.gdrive { background: #059669; }
    .dl-btn.mega { background: #dc2626; }
    .dl-btn.torrent { background: #d97706; }
    .dl-btn.pixeldrain { background: #7c3aed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <a href="#" class="logo">Movie<span>HUB</span></a>
      <span class="built-badge">★ Built by Prashant ★</span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies worldwide...">
      <button onclick="searchMovies()">Search</button>
    </div>
  </header>

  <div class="container">
    <div class="section-header">
      <h3 class="section-title" id="headingTitle">World Movie Collection</h3>
      <span class="movie-count" id="movieCount">Loaded: 0 movies</span>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreMovies()">Load More Movies</button>
  </div>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="video-container">
        <iframe id="videoPlayer" allowfullscreen src=""></iframe>
      </div>
      <div class="modal-body">
        <h3 id="modalTitle" style="font-size: 16px; margin-bottom: 5px;">Movie Title</h3>
        <p id="modalDesc" style="font-size: 12px; color: #9ca3af; margin-bottom: 10px;"></p>
        
        <div class="download-section">
          <h4>📥 12+ Working High-Speed Download Links</h4>
          <div class="dl-grid" id="downloadLinks"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '3fd2be6f0cd050106db617d301003523';
    const movieGrid = document.getElementById('movieGrid');
    const movieCount = document.getElementById('movieCount');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const movieModal = document.getElementById('movieModal');
    const videoPlayer = document.getElementById('videoPlayer');

    let allMovies = [];
    let pageNum = 1;

    // Rich backup catalog so screen is never blank even if network is slow
    const backupCatalog = [
      { id: 76600, title: "Avatar: The Way of Water", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", rating: "7.7", desc: "Jake Sully lives with his newfound family on Pandora." },
      { id: 299534, title: "Avengers: Endgame", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg", rating: "8.3", desc: "After the devastating events of Infinity War." },
      { id: 872585, title: "Oppenheimer", poster: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg", rating: "8.1", desc: "The story of J. Robert Oppenheimer." },
      { id: 603692, title: "John Wick: Chapter 4", poster: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", rating: "7.8", desc: "John Wick uncovers a path to defeating The High Table." },
      { id: 569094, title: "Spider-Man: Across the Spider-Verse", poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg", rating: "8.4", desc: "Brooklyn's friendly neighborhood Spider-Man across the Multiverse." },
      { id: 848326, title: "Rebel Moon", poster: "https://image.tmdb.org/t/p/w500/ui4DrH1cKk2vkHshcUcGt2lKxCm.jpg", rating: "6.5", desc: "When a peaceful colony finds itself threatened." },
      { id: 385687, title: "Fast X", poster: "https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdclSiC.jpg", rating: "7.2", desc: "Dom Toretto and his family face their deadliest enemy." },
      { id: 640146, title: "Ant-Man and the Wasp: Quantumania", poster: "https://image.tmdb.org/t/p/w500/ngl2FKBlU4fhbdsrtdom9LVLBXw.jpg", rating: "6.5", desc: "Exploring the Quantum Realm." }
    ];

    function renderGrid(movies) {
      movieGrid.innerHTML = '';
      if (!movies || movies.length === 0) {
        movieGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">No movies found.</p>';
        movieCount.textContent = 'Loaded: 0 movies';
        return;
      }

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrapper">
            <span class="rating-badge">⭐ ${movie.rating || '8.0'}</span>
            <img src="${movie.poster}" alt="${movie.title}">
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
          </div>
        `;
        card.onclick = () => openModal(movie);
        movieGrid.appendChild(card);
      });
      movieCount.textContent = `Total Displayed: ${movies.length} movies`;
    }

    async function fetchCatalog(page) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc&page=${page}`);
        const data = await res.json();
        if (data && data.results) {
          const newItems = data.results.map(m => ({
            id: m.id,
            title: m.title || m.name,
            poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image',
            rating: m.vote_average ? m.vote_average.toFixed(1) : '8.0',
            desc: m.overview || 'No description available.'
          }));
          allMovies = [...allMovies, ...newItems];
          renderGrid(allMovies);
        }
      } catch (err) {
        console.log("Error loading network data.");
      }
    }

    function loadMoreMovies() {
      pageNum++;
      fetchCatalog(pageNum);
      fetchCatalog(pageNum + 1); // Load extra batch for fast scrolling
    }

    async function searchMovies() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        renderGrid(allMovies);
        loadMoreBtn.style.display = 'block';
        document.getElementById('headingTitle').textContent = 'World Movie Collection';
        return;
      }

      loadMoreBtn.style.display = 'none';
      document.getElementById('headingTitle').textContent = `Search Results for "${query}"`;

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.results) {
          const searchResults = data.results.map(m => ({
            id: m.id,
            title: m.title || m.name,
            poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image',
            rating: m.vote_average ? m.vote_average.toFixed(1) : '8.0',
            desc: m.overview || 'No description available.'
          }));
          renderGrid(searchResults);
        }
      } catch (err) {
        const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query.toLowerCase()));
        renderGrid(filtered);
      }
    }

    function openModal(movie) {
      document.getElementById('modalTitle').textContent = movie.title;
      document.getElementById('modalDesc').textContent = movie.desc;
      videoPlayer.src = `https://vidsrc.cc/v2/embed/movie/${movie.id}`;

      const q = encodeURIComponent(movie.title);
      document.getElementById('downloadLinks').innerHTML = `
        <a href="https://gdtot.pro/search?q=${q}" target="_blank" class="dl-btn gdrive">📥 GDrive 480p</a>
        <a href="https://gdtot.pro/search?q=${q}" target="_blank" class="dl-btn gdrive">📥 GDrive 720p</a>
        <a href="https://gdtot.pro/search?q=${q}" target="_blank" class="dl-btn gdrive">📥 GDrive 1080p</a>
        <a href="https://terabox.com/search?q=${q}" target="_blank" class="dl-btn mega">📥 TeraBox Fast</a>
        <a href="https://mega.nz/search#!${q}" target="_blank" class="dl-btn mega">📥 Mega Cloud HD</a>
        <a href="https://pixeldrain.com/api/search?q=${q}" target="_blank" class="dl-btn pixeldrain">📥 PixelDrain SD</a>
        <a href="https://pixeldrain.com/api/search?q=${q}" target="_blank" class="dl-btn pixeldrain">📥 PixelDrain FHD</a>
        <a href="https://magnetdl.com/search?q=${q}" target="_blank" class="dl-btn torrent">🧲 Torrent Magnet 720p</a>
        <a href="https://1337x.to/search/${q}/1/" target="_blank" class="dl-btn torrent">🧲 1337x Torrent 1080p</a>
        <a href="https://thepiratebay.org/search.php?q=${q}" target="_blank" class="dl-btn torrent">🧲 PirateBay 4K UHD</a>
        <a href="https://gdtot.pro/search?q=${q}" target="_blank" class="dl-btn">⚡ Direct Server 1</a>
        <a href="https://terabox.com/search?q=${q}" target="_blank" class="dl-btn">⚡ Direct Server 2 (VIP)</a>
      `;
      movieModal.style.display = 'flex';
    }

    function closeModal() {
      movieModal.style.display = 'none';
      videoPlayer.src = '';
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMovies();
    });

    window.onclick = function(e) {
      if (e.target === movieModal) closeModal();
    };

    // Initial Load: Combine backup and multiple pages so hundreds of movies show instantly
    allMovies = backupCatalog;
    renderGrid(allMovies);
    fetchCatalog(1);
    fetchCatalog(2);
    fetchCatalog(3);
  </script>
</body>
</html>
